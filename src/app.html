<!doctype html>
<html lang="de" data-default-theme="%classroom.theme%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<title>classRoom</title>
		<script>
			// Theme vor dem ersten Zeichnen setzen (kein helles Aufblitzen). Eigene Wahl steht im
			// localStorage, sonst gilt DEFAULT_THEME aus der .env bzw. die Systemeinstellung.
			(function () {
				var root = document.documentElement;
				var media = window.matchMedia('(prefers-color-scheme: dark)');
				function stored() {
					try {
						return localStorage.getItem('theme');
					} catch (e) {
						return null;
					}
				}
				function apply() {
					var theme = stored() || root.getAttribute('data-default-theme');
					if (theme !== 'light' && theme !== 'dark') theme = media.matches ? 'dark' : 'light';
					root.setAttribute('data-theme', theme);
				}
				apply();
				media.addEventListener('change', function () {
					if (!stored()) apply();
				});
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
