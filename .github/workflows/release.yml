# Baut bei einem Versions-Tag (z. B. v0.1.0) das Docker-Image, veröffentlicht es in der
# GitHub Container Registry (ghcr.io) und legt ein GitHub-Release an.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write # GitHub-Release anlegen
  packages: write # Image nach ghcr.io pushen

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/classroom

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Für das arm64-Image (z. B. Raspberry Pi oder Mac mit Apple-Chip)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=classRoom
            org.opencontainers.image.description=Werkzeugkasten für den Unterricht

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Abschnitt der Version aus CHANGELOG.md plus Installationshinweis als Release-Text
      - name: Release-Notizen aus CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[0-9]/) { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ## Docker-Image

          \`\`\`bash
          docker pull ${IMAGE}:${VERSION}
          \`\`\`

          Installation mit Docker Compose: siehe [README](https://github.com/${GITHUB_REPOSITORY}#installation) · alle Versionen im [CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md).
          EOF

      - name: GitHub-Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
