# Prüft jeden Push auf main und jeden Pull Request (auch von Dependabot): Lint, Tests, Build.
# Gleiche Befehle wie im Dockerfile – rot hier heißt: das Release-Image würde auch nicht bauen.
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx svelte-kit sync
      - run: npm run lint
      - run: npm test
      - run: npm run build
